<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기가차드 카메라</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0e0f12; color: #e8e8ea;
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 14px 28px;
  }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
  .sub { margin: 0; color: #9a9ba3; font-size: 13px; }
  .stage {
    position: relative; width: min(960px, 100%); background: #000; border-radius: 14px; overflow: hidden;
    aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center;
    border: 1px solid #25262c;
  }
  canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
  canvas.mirror { transform: scaleX(-1); }
  video { display: none; }
  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: 12px; text-align: center; padding: 20px; background: rgba(0,0,0,.55); font-size: 15px;
  }
  .overlay.hidden { display: none; }
  button {
    background: #2a6df4; color: #fff; border: 0; border-radius: 10px; padding: 11px 20px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button.secondary { background: #2b2d34; color: #e8e8ea; font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  .status {
    position: absolute; left: 10px; top: 10px; font-size: 12px; padding: 4px 9px; border-radius: 99px;
    background: rgba(0,0,0,.6); color: #cfd0d6;
  }
  .status.ok { color: #6ee7a0; }
  .panel {
    width: min(960px, 100%); display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 10px 22px; background: #15161b; border: 1px solid #25262c; border-radius: 14px; padding: 16px;
  }
  .panel label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: #b9bac2; }
  .panel label span b { color: #fff; font-weight: 600; float: right; }
  input[type=range] { width: 100%; accent-color: #2a6df4; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; grid-column: 1 / -1; }
  .row label { flex-direction: row; align-items: center; gap: 7px; }
  .note { color: #7d7e87; font-size: 12px; grid-column: 1 / -1; margin: 0; }
</style>
</head>
<body>
  <h1>🗿 기가차드 카메라</h1>
  <p class="sub">얼굴을 인식하면 실시간으로 각진 턱선·긴 턱끝·깊은 눈매로 바꿔줍니다. 영상은 서버로 전송되지 않고 브라우저 안에서만 처리됩니다.</p>

  <div class="stage">
    <canvas id="out" class="mirror"></canvas>
    <video id="cam" playsinline muted></video>
    <div class="status" id="status">대기 중</div>
    <div class="overlay" id="overlay">
      <div id="overlayMsg">카메라 권한을 허용하면 시작됩니다.</div>
      <button id="startBtn">카메라 시작</button>
    </div>
  </div>

  <div class="panel">
    <div class="row">
      <label><input type="checkbox" id="enable" checked> 변환 켜기</label>
      <label><input type="checkbox" id="mirror" checked> 거울 모드</label>
      <button class="secondary" id="snapBtn" disabled>📸 사진 저장</button>
    </div>
    <label><span>전체 강도 <b id="vIntensity">1.0</b></span><input type="range" id="intensity" min="0" max="2" step="0.05" value="1"></label>
    <label><span>턱선 (각진 정도) <b id="vJaw">1.0</b></span><input type="range" id="jaw" min="0" max="2" step="0.05" value="1"></label>
    <label><span>턱끝 (길이) <b id="vChin">1.0</b></span><input type="range" id="chin" min="0" max="2" step="0.05" value="1"></label>
    <label><span>광대·볼 (홀쭉) <b id="vCheek">1.0</b></span><input type="range" id="cheek" min="0" max="2" step="0.05" value="1"></label>
    <label><span>눈매·눈썹 (깊은 눈) <b id="vEyes">1.0</b></span><input type="range" id="eyes" min="0" max="2" step="0.05" value="1"></label>
    <label><span>코 <b id="vNose">1.0</b></span><input type="range" id="nose" min="0" max="2" step="0.05" value="1"></label>
    <label><span>차드 톤 (대비·채도) <b id="vTone">1.0</b></span><input type="range" id="tone" min="0" max="2" step="0.05" value="1"></label>
    <p class="note">얼굴 1명만 변환합니다. 정면에 가까울수록 자연스럽고, 조명이 밝으면 인식이 안정적입니다. 이 앱은 장난용 필터이며 실제 외모와 무관합니다.</p>
  </div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const $ = (id) => document.getElementById(id);
const video = $("cam"), canvas = $("out"), statusEl = $("status");
const overlay = $("overlay"), overlayMsg = $("overlayMsg"), startBtn = $("startBtn");

/* ---------- 변형 핸들 정의 ----------
   [랜드마크 번호, 그룹, dx(바깥쪽+, 얼굴폭 비율), dy(아래쪽+, 얼굴폭 비율), 반경(얼굴폭 비율)] */
const HANDLES = [
  // 턱끝: 아래로 길게
  [152, "chin", 0, 0.11, 0.17],
  [175, "chin", 0, 0.07, 0.12],
  [148, "chin", 0.02, 0.05, 0.10], [377, "chin", 0.02, 0.05, 0.10],
  // 턱선: 바깥·아래로 각지게
  [149, "jaw", 0.045, 0.035, 0.12], [378, "jaw", 0.045, 0.035, 0.12],
  [172, "jaw", 0.07, 0.02, 0.13],  [397, "jaw", 0.07, 0.02, 0.13],
  [58,  "jaw", 0.06, 0.0, 0.13],   [288, "jaw", 0.06, 0.0, 0.13],
  [136, "jaw", 0.055, 0.03, 0.12], [365, "jaw", 0.055, 0.03, 0.12],
  [132, "jaw", 0.04, 0.0, 0.12],   [361, "jaw", 0.04, 0.0, 0.12],
  // 볼은 안쪽(홀쭉), 광대는 살짝 돌출
  [205, "cheek", -0.03, 0, 0.11],  [425, "cheek", -0.03, 0, 0.11],
  [116, "cheek", 0.015, -0.01, 0.09], [345, "cheek", 0.015, -0.01, 0.09],
  // 눈썹 아래로 (브로우 릿지)
  [105, "eyes", 0, 0.014, 0.08], [334, "eyes", 0, 0.014, 0.08],
  [66,  "eyes", 0, 0.012, 0.07], [296, "eyes", 0, 0.012, 0.07],
  [107, "eyes", 0, 0.010, 0.07], [336, "eyes", 0, 0.010, 0.07],
  // 윗눈꺼풀 내리고 아랫눈꺼풀 올려 헌터 아이
  [159, "eyes", 0, 0.010, 0.05], [386, "eyes", 0, 0.010, 0.05],
  [158, "eyes", 0, 0.008, 0.05], [385, "eyes", 0, 0.008, 0.05],
  [145, "eyes", 0, -0.006, 0.05], [374, "eyes", 0, -0.006, 0.05],
  // 콧방울 좁게
  [129, "nose", -0.025, 0, 0.06], [358, "nose", -0.025, 0, 0.06],
];
const MAX = 40;
if (HANDLES.length > MAX) throw new Error("핸들 수 초과");

/* ---------- WebGL ---------- */
const gl = canvas.getContext("webgl", { premultipliedAlpha: false, preserveDrawingBuffer: true });
const VS = `attribute vec2 p; varying vec2 vUv; void main(){ vUv = p*0.5+0.5; gl_Position = vec4(p,0.0,1.0); }`;
const FS = `
precision highp float;
#define MAX ${MAX}
uniform sampler2D uTex; uniform float uAspect; uniform int uN; uniform float uTone;
uniform vec2 uC[MAX]; uniform vec2 uD[MAX]; uniform float uR[MAX];
varying vec2 vUv;
void main(){
  vec2 src = vUv;
  for (int i = 0; i < MAX; i++) {
    if (i >= uN) break;
    vec2 d = (vUv - uC[i]) * vec2(uAspect, 1.0);
    float w = exp(-dot(d, d) / (uR[i] * uR[i]));
    src -= uD[i] * w;
  }
  vec3 c = texture2D(uTex, src).rgb;
  float l = dot(c, vec3(0.299, 0.587, 0.114));
  c = mix(vec3(l), c, 1.0 - 0.18 * uTone);          // 채도 약간 낮춤
  c = (c - 0.5) * (1.0 + 0.14 * uTone) + 0.5;       // 대비 올림
  c *= 1.0 - 0.04 * uTone;
  gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
}`;
function sh(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const locP = gl.getAttribLocation(prog, "p");
gl.enableVertexAttribArray(locP);
gl.vertexAttribPointer(locP, 2, gl.FLOAT, false, 0, 0);
const U = {};
for (const n of ["uTex", "uAspect", "uN", "uTone", "uC", "uD", "uR"]) U[n] = gl.getUniformLocation(prog, n);
const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

const arrC = new Float32Array(MAX * 2), arrD = new Float32Array(MAX * 2), arrR = new Float32Array(MAX);

/* ---------- UI 값 ---------- */
const ids = ["intensity", "jaw", "chin", "cheek", "eyes", "nose", "tone"];
const val = {};
for (const id of ids) {
  const el = $(id), out = $("v" + id[0].toUpperCase() + id.slice(1));
  val[id] = parseFloat(el.value);
  el.addEventListener("input", () => { val[id] = parseFloat(el.value); out.textContent = val[id].toFixed(1); });
}
$("mirror").addEventListener("change", (e) => canvas.classList.toggle("mirror", e.target.checked));

/* ---------- 핸들 계산 ---------- */
function computeHandles(lm, aspect) {
  const P = (i) => [lm[i].x * aspect, lm[i].y];
  const L = P(234), R = P(454);
  let ex = [R[0] - L[0], R[1] - L[1]];
  const fw = Math.hypot(ex[0], ex[1]);
  if (fw < 1e-4) return 0;
  ex = [ex[0] / fw, ex[1] / fw];
  let ey = [-ex[1], ex[0]];
  if (ey[1] < 0) ey = [-ey[0], -ey[1]];        // 항상 화면 아래 방향
  const cx = (L[0] + R[0]) / 2, cy = (L[1] + R[1]) / 2;

  let n = 0;
  for (const [idx, group, dx, dy, r] of HANDLES) {
    const m = val.intensity * val[group];
    const p = P(idx);
    const s = Math.sign((p[0] - cx) * ex[0] + (p[1] - cy) * ex[1]);
    const dxv = dx * s * m * fw, dyv = dy * m * fw;
    const Dx = dxv * ex[0] + dyv * ey[0];
    const Dy = dxv * ex[1] + dyv * ey[1];
    arrC[n * 2] = lm[idx].x;       arrC[n * 2 + 1] = 1 - lm[idx].y;
    arrD[n * 2] = Dx / aspect;     arrD[n * 2 + 1] = -Dy;
    arrR[n] = r * fw;
    n++;
  }
  return n;
}

/* ---------- 랜드마크 스무딩 ---------- */
let smooth = null;
function smoothLandmarks(lm) {
  if (!smooth) { smooth = lm.map((p) => ({ x: p.x, y: p.y })); return smooth; }
  const a = 0.55;
  for (let i = 0; i < lm.length; i++) {
    smooth[i].x += (lm[i].x - smooth[i].x) * a;
    smooth[i].y += (lm[i].y - smooth[i].y) * a;
  }
  return smooth;
}

/* ---------- 메인 ---------- */
let landmarker = null, running = false, lastTime = -1, missed = 0, wantSnap = false;

async function createLandmarker() {
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const base = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
  const opts = (delegate) => ({
    baseOptions: { modelAssetPath: base, delegate },
    runningMode: "VIDEO", numFaces: 1,
    minFaceDetectionConfidence: 0.5, minFacePresenceConfidence: 0.5, minTrackingConfidence: 0.5,
  });
  try { return await FaceLandmarker.createFromOptions(fileset, opts("GPU")); }
  catch (e) { console.warn("GPU delegate 실패, CPU로 재시도", e); return await FaceLandmarker.createFromOptions(fileset, opts("CPU")); }
}

function setStatus(text, ok) { statusEl.textContent = text; statusEl.classList.toggle("ok", !!ok); }

async function start() {
  startBtn.disabled = true;
  overlayMsg.textContent = "카메라와 얼굴 인식 모델을 불러오는 중…";
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false,
    });
    video.srcObject = stream;
    await video.play();
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    $("overlay").parentElement.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
    landmarker = await createLandmarker();
  } catch (e) {
    console.error(e);
    startBtn.disabled = false;
    overlayMsg.textContent = (e && e.name === "NotAllowedError")
      ? "카메라 권한이 거부됐습니다. 브라우저 주소창에서 권한을 허용한 뒤 다시 시도하세요."
      : "시작 실패: " + (e && e.message ? e.message : e) + "\n(localhost 또는 https 로 열었는지, 인터넷에 연결돼 있는지 확인하세요.)";
    overlayMsg.style.whiteSpace = "pre-line";
    return;
  }
  overlay.classList.add("hidden");
  $("snapBtn").disabled = false;
  running = true;
  requestAnimationFrame(loop);
}

function loop() {
  if (!running) return;
  if (video.readyState >= 2) {
    const aspect = video.videoWidth / video.videoHeight;
    let n = 0;
    if (video.currentTime !== lastTime) {
      lastTime = video.currentTime;
      const res = landmarker.detectForVideo(video, performance.now());
      if (res.faceLandmarks && res.faceLandmarks.length) {
        missed = 0;
        const lm = smoothLandmarks(res.faceLandmarks[0]);
        if ($("enable").checked) n = computeHandles(lm, aspect);
        setStatus("얼굴 인식됨", true);
      } else {
        if (++missed > 5) smooth = null;
        setStatus("얼굴을 찾는 중…", false);
      }
      loop.n = n;
    }
    n = $("enable").checked && missed <= 5 && smooth ? (loop.n || 0) : 0;
    // 얼굴이 사라진 직후 몇 프레임은 마지막 핸들 유지, 이후엔 원본 표시
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video);
    gl.uniform1i(U.uTex, 0);
    gl.uniform1f(U.uAspect, aspect);
    gl.uniform1i(U.uN, n);
    gl.uniform1f(U.uTone, $("enable").checked ? val.tone : 0);
    gl.uniform2fv(U.uC, arrC); gl.uniform2fv(U.uD, arrD); gl.uniform1fv(U.uR, arrR);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    if (wantSnap) { wantSnap = false; savePhoto(); }
  }
  requestAnimationFrame(loop);
}

function savePhoto() {
  const t = document.createElement("canvas");
  t.width = canvas.width; t.height = canvas.height;
  const c = t.getContext("2d");
  if ($("mirror").checked) { c.translate(t.width, 0); c.scale(-1, 1); }
  c.drawImage(canvas, 0, 0);
  const a = document.createElement("a");
  a.href = t.toDataURL("image/png");
  a.download = "gigachad-" + Date.now() + ".png";
  a.click();
}

startBtn.addEventListener("click", start);
$("snapBtn").addEventListener("click", () => { wantSnap = true; });
</script>
</body>
</html>
